<!DOCTYPE html>
<html lang="th">
<head>
  <title>DSD Phayao — สรุปผลการฝึกอบรม</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:#0a2d6e; --blue:#1a56c4; --bluelt:#3b82f6;
      --green:#16a34a; --red:#dc2626; --gold:#d4a017; --white:#fff;
      --ink:#0f172a; --mid:#475569; --border:#e2e8f0; --radius:10px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; min-height:100vh; font-family:'Sarabun',sans-serif; background:#fff; }
    .wrap { width:100%; min-height:100vh; background:#fff; display:flex; flex-direction:column; }

    .head { background:linear-gradient(145deg,var(--navy),var(--blue)); padding:28px 24px; text-align:center; position:relative; overflow:hidden; }
    .head::before { content:''; position:absolute; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.05); top:-50px; right:-40px; }
    .head h1 { color:#fff; font-size:1.4rem; font-weight:800; position:relative; z-index:1; }
    .head p { color:rgba(255,255,255,.75); font-size:.8rem; margin-top:4px; position:relative; z-index:1; }
    .badge { display:inline-block; margin-top:8px; padding:3px 12px; background:var(--gold); color:#fff; border-radius:20px; font-size:.72rem; font-weight:700; position:relative; z-index:1; }
    .back-link { position:relative; z-index:1; display:inline-block; margin-top:10px; color:rgba(255,255,255,.85); font-size:.78rem; text-decoration:underline; }

    .body { flex:1; padding:24px 18px 36px; }
    .field { margin-bottom:16px; }
    .label { font-size:.9rem; font-weight:700; color:var(--ink); margin-bottom:6px; display:block; }

    select, input {
      width:100%; padding:12px 14px; font-size:.95rem; font-family:'Sarabun',sans-serif;
      border:1.5px solid var(--border); border-radius:var(--radius); background:#fff; color:var(--ink);
      outline:none; appearance:none; -webkit-appearance:none;
    }
    select:focus { border-color:var(--bluelt); box-shadow:0 0 0 3px rgba(59,130,246,.1); }

    .warn-box { display:none; margin-bottom:16px; padding:14px 16px; background:#fef2f2; border:1.5px solid #fca5a5; border-radius:10px; color:#7f1d1d; font-size:.9rem; line-height:1.6; }

    .course-header { margin-bottom:16px; padding:16px; background:#eff6ff; border:1.5px solid #bfdbfe; border-radius:10px; }
    .course-header .cname { font-size:1.05rem; font-weight:800; color:var(--navy); margin-bottom:4px; }
    .course-header .cperiod { font-size:.85rem; color:var(--mid); }

    .summary-cards { display:flex; gap:8px; margin-bottom:16px; }
    .summary-cards .card { flex:1; text-align:center; padding:12px 6px; border-radius:10px; border:1.5px solid; }
    .summary-cards .card .num { font-size:1.5rem; font-weight:800; }
    .summary-cards .card .lbl { font-size:.74rem; color:var(--mid); margin-top:2px; }

    .tbl-wrap { border:1.5px solid var(--border); border-radius:10px; overflow:hidden; overflow-x:auto; margin-bottom:16px; }
    table.report-tbl { width:100%; border-collapse:collapse; font-size:.86rem; min-width:480px; }
    table.report-tbl thead tr { background:#f1f5f9; }
    table.report-tbl th { padding:10px 8px; text-align:left; font-weight:700; color:var(--ink); }
    table.report-tbl td { padding:8px 8px; border-top:1px solid #f1f5f9; }

    .btn-print { width:100%; padding:14px; font-family:'Sarabun',sans-serif; font-size:1rem; font-weight:800;
      color:#fff; background:linear-gradient(135deg,var(--green),#22c55e); border:none; border-radius:var(--radius);
      cursor:pointer; box-shadow:0 4px 14px rgba(22,163,74,.28); }
    .btn-print:active { opacity:.85; transform:scale(.98); }

    .swal2-popup { font-family:'Sarabun',sans-serif !important; border-radius:18px !important; }

    /* พิมพ์เป็นเอกสารทางการ: ซ่อนทุกอย่างบนจอ ยกเว้น #printArea ตอนสั่งพิมพ์ */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>สรุปผลการฝึกอบรม</h1>
      <p>DSD Phayao Smart Check-in</p>
      <span class="badge">สำหรับเจ้าหน้าที่</span><br>
      <a class="back-link" href="Admin.html">← กลับหน้าแอดมิน</a>
    </div>

    <div class="body">
      <div class="field">
        <label class="label">เลือกหลักสูตร</label>
        <select id="courseSel">
          <option value="" selected disabled>-- กำลังโหลด... --</option>
        </select>
      </div>

      <div class="warn-box" id="warnBox"></div>

      <div id="resultWrap" style="display:none">
        <div class="course-header">
          <div class="cname" id="sumCourse"></div>
          <div class="cperiod" id="sumPeriod"></div>
        </div>

        <div class="summary-cards">
          <div class="card" style="background:#eff6ff;border-color:#93c5fd">
            <div class="num" style="color:#1a56c4" id="cntTotal">-</div>
            <div class="lbl">เข้าฝึกอบรม (คน)</div>
          </div>
          <div class="card" style="background:#f0fdf4;border-color:#86efac">
            <div class="num" style="color:#16a34a" id="cntPassed">-</div>
            <div class="lbl">ผ่าน (คน)</div>
          </div>
          <div class="card" style="background:#fef2f2;border-color:#fca5a5">
            <div class="num" style="color:#dc2626" id="cntFailed">-</div>
            <div class="lbl">ไม่ผ่าน (คน)</div>
          </div>
        </div>

        <div class="tbl-wrap">
          <table class="report-tbl">
            <thead>
              <tr>
                <th style="width:40px;text-align:center">#</th>
                <th>ชื่อ-นามสกุล</th>
                <th style="width:90px;text-align:center">รวมเวลาฝึก</th>
                <th style="width:80px;text-align:center">คิดเป็น</th>
                <th style="width:90px;text-align:center">ผลการฝึก</th>
              </tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>

        <button type="button" class="btn-print" onclick="window.print()">🖨️ พิมพ์เอกสารสรุปผลการฝึกอบรม</button>
      </div>
    </div>
  </div>

  <!-- พื้นที่สำหรับพิมพ์เท่านั้น -->
  <div id="printArea" style="display:none"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyiCJqBUUNVKwUww_duaMg281Kp4lGFev4GEZqGjCSx84yin4aqU0SS4YtfOQpUMRazaw/exec';
    const thMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

    async function callApi(action, payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'เกิดข้อผิดพลาด');
      return data.result;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // d/M/yyyy (พ.ศ. ปกติจะเก็บเป็น ค.ศ. ในชีต) -> "8 มิ.ย. 2569"
    function toThaiDateDisplay(dmy) {
      const parts = String(dmy || '').split('/');
      if (parts.length !== 3) return dmy || '-';
      const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
      if (!d || !m || !y) return dmy;
      return d + ' ' + thMonths[m - 1] + ' ' + (y + 543);
    }

    async function loadCourses() {
      const sel = document.getElementById('courseSel');
      try {
        const courses = await callApi('getCourses', {});
        sel.innerHTML = '<option value="" selected disabled>-- เลือกหลักสูตร --</option>';
        (courses || []).forEach(c => {
          const o = document.createElement('option');
          o.value = c; o.textContent = c; sel.appendChild(o);
        });

        // ถ้ามาจากลิงก์ที่ระบุ ?course=... (เช่น กดมาจากหน้าแอดมิน) ให้เลือกหลักสูตรนั้นให้อัตโนมัติ
        const params = new URLSearchParams(window.location.search);
        const pre = params.get('course');
        if (pre && courses && courses.indexOf(pre) !== -1) {
          sel.value = pre;
          loadSummary();
        }
      } catch (e) {
        sel.innerHTML = '<option value="" selected disabled>-- โหลดไม่สำเร็จ --</option>';
      }
    }
    loadCourses();

    document.getElementById('courseSel').addEventListener('change', loadSummary);

    async function loadSummary() {
      const course = document.getElementById('courseSel').value;
      const resultWrap = document.getElementById('resultWrap');
      const warnBox = document.getElementById('warnBox');
      if (!course) return;

      resultWrap.style.display = 'none';
      warnBox.style.display = 'none';

      Swal.fire({ title: '⏳ กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const r = await callApi('getTrainingSummary', { course });
        Swal.close();
        renderSummary(r);
      } catch (e) {
        Swal.close();
        warnBox.textContent = '⚠️ ' + e.message;
        warnBox.style.display = 'block';
      }
    }

    function renderSummary(r) {
      document.getElementById('sumCourse').textContent = 'หลักสูตร: ' + r.course;
      document.getElementById('sumPeriod').textContent =
        'ฝึกระหว่างวันที่ ' + toThaiDateDisplay(r.startDate) + ' ถึง ' + toThaiDateDisplay(r.endDate) +
        '  (รวม ' + r.totalHours + ' ชม.)';

      const tbody = document.getElementById('tblBody');
      let html = '';
      r.list.forEach((p, i) => {
        const badge = p.passed
          ? '<span style="color:#16a34a;background:#f0fdf4;border:1px solid #86efac;padding:3px 10px;border-radius:20px;font-weight:700;font-size:.8rem">ผ่าน</span>'
          : '<span style="color:#dc2626;background:#fef2f2;border:1px solid #fca5a5;padding:3px 10px;border-radius:20px;font-weight:700;font-size:.8rem">ไม่ผ่าน</span>';
        html += '<tr>'
          + '<td style="text-align:center;color:#94a3b8">' + (i + 1) + '</td>'
          + '<td>' + escapeHtml(p.name) + '</td>'
          + '<td style="text-align:center">' + p.hours + ' ชม.</td>'
          + '<td style="text-align:center">' + p.percent + '%</td>'
          + '<td style="text-align:center">' + badge + '</td>'
          + '</tr>';
      });
      tbody.innerHTML = html;

      document.getElementById('cntTotal').textContent = r.totalPeople;
      document.getElementById('cntPassed').textContent = r.totalPassed;
      document.getElementById('cntFailed').textContent = r.totalFailed;

      document.getElementById('resultWrap').style.display = 'block';
      buildPrintArea(r);
    }

    function buildPrintArea(r) {
      const today = new Date();
      const printedStr = today.getDate() + ' ' + thMonths[today.getMonth()] + ' ' + (today.getFullYear() + 543);

      let rows = '';
      r.list.forEach((p, i) => {
        rows += '<tr>'
          + '<td style="border:1px solid #333;padding:6px 8px;text-align:center">' + (i + 1) + '</td>'
          + '<td style="border:1px solid #333;padding:6px 8px">' + escapeHtml(p.name) + '</td>'
          + '<td style="border:1px solid #333;padding:6px 8px;text-align:center">' + p.hours + '</td>'
          + '<td style="border:1px solid #333;padding:6px 8px;text-align:center">' + p.percent + '%</td>'
          + '<td style="border:1px solid #333;padding:6px 8px;text-align:center">' + (p.passed ? 'ผ่าน' : 'ไม่ผ่าน') + '</td>'
          + '</tr>';
      });

      document.getElementById('printArea').innerHTML =
        '<div style="font-family:\'Sarabun\',sans-serif;color:#111">'
        + '<div style="text-align:center;margin-bottom:18px">'
        + '<div style="font-size:1.3rem;font-weight:700">สรุปผลการฝึกอบรม</div>'
        + '<div style="font-size:.95rem;color:#444">สำนักงานพัฒนาฝีมือแรงงานพะเยา</div>'
        + '</div>'
        + '<div style="margin-bottom:14px;font-size:1rem;line-height:1.8">'
        + '<div><b>หลักสูตร:</b> ' + escapeHtml(r.course) + '</div>'
        + '<div><b>ฝึกระหว่างวันที่:</b> ' + toThaiDateDisplay(r.startDate) + ' ถึง ' + toThaiDateDisplay(r.endDate) + ' (รวม ' + r.totalHours + ' ชม.)</div>'
        + '</div>'
        + '<table style="width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:24px">'
        + '<thead><tr style="background:#eee">'
        + '<th style="border:1px solid #333;padding:6px 8px">ลำดับ</th>'
        + '<th style="border:1px solid #333;padding:6px 8px">ชื่อ-นามสกุล</th>'
        + '<th style="border:1px solid #333;padding:6px 8px">รวมเวลาฝึก (ชม.)</th>'
        + '<th style="border:1px solid #333;padding:6px 8px">คิดเป็น (%)</th>'
        + '<th style="border:1px solid #333;padding:6px 8px">ผลการฝึก</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table>'
        + '<div style="font-size:1rem;margin-bottom:30px">'
        + '<div>สรุปผลการฝึกอบรม: เข้าฝึกอบรมทั้งหมด ' + r.totalPeople + ' คน'
        + '&nbsp;&nbsp;&nbsp;ผ่านการฝึกอบรม ' + r.totalPassed + ' คน'
        + '&nbsp;&nbsp;&nbsp;ไม่ผ่านการฝึกอบรม ' + r.totalFailed + ' คน</div>'
        + '</div>'
        + '<div style="display:flex;justify-content:flex-end;font-size:.95rem">'
        + '<div style="text-align:center">'
        + '<div>ลงชื่อ .................................................. ผู้รับรอง</div>'
        + '<div style="margin-top:8px">( .................................................. )</div>'
        + '<div style="margin-top:14px">วันที่พิมพ์เอกสาร ' + printedStr + '</div>'
        + '</div></div></div>';
    }
  </script>
</body>
</html>
